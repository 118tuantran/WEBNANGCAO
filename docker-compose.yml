services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webnangcao
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - warehouse-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      WAREHOUSE_DB_CONNECTION: Server=mysql;Port=3306;Database=webnangcao;User=root;Password=change-me;
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  warehouse-mysql:
